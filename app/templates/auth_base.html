<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon-32x32.png') }}" sizes="any">
    <link rel="icon" href="{{ url_for('static', filename='favicon-16x16.png') }}" sizes="any">
    <link rel="icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}" sizes="any">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">

    <!-- Title & Description -->
    <title>{% block title %}MasarPro | مسار برو - منصة تتبع طلبات التوظيف{% endblock %}</title>
    <meta name="description"
          content="مسار برو يساعدك على تنظيم وتتبع طلبات التوظيف، إدارة السير الذاتية، خطابات التغطية، المقابلات، والعروض الوظيفية في مكان واحد، لتسهيل رحلة البحث عن وظيفة.">
    <meta name="author" content="MasarPro">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://masarpro.app/">

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MasarPro">
    <meta property="og:title" content="MasarPro | مسار برو - منصة تتبع طلبات التوظيف">
    <meta property="og:description"
          content="تتبع طلبات التوظيف والسيرة الذاتية والمقابلات في مكان واحد.">
    <meta property="og:url" content="https://masarpro.app/">
    <meta property="og:image" content="https://masarpro.app/static/img/og-image.png">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="MasarPro | مسار برو - منصة تتبع طلبات التوظيف">
    <meta name="twitter:description"
          content="تتبع طلبات التوظيف والسيرة الذاتية والمقابلات في مكان واحد.">
    <meta name="twitter:image" content="https://masarpro.app/static/img/og-image.png">

    <!-- Structured Data -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "SoftwareApplication",
            "name": "MasarPro",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://masarpro.app",
            "description": "منصة لتنظيم وتتبع طلبات التوظيف والسير الذاتية والمقابلات.",
            "image": "https://masarpro.app/static/img/og-image.png"
        }
    </script>
    <title>{% block title %}مسار برو {% endblock %}</title>
    <!-- ========================= CSS here ========================= -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- ========================= auth-section start ========================= -->
<section id="auth-section">
    <div class="auth-container">
        <div class="auth-card-1">
            <object data="{{ url_for('static', filename='img/logo.svg') }}"
                    type="image/svg+xml"
                    class="logo-color"></object>
            {% block form_content %}
            {% endblock %}
        </div>
        <div class="auth-card-2">
            <div class="auth-logo">
                <img class="logo-size-auth" src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo">
                <b><span>Masar</span>Pro</b>
            </div>
            <div class="auth-features">
                <div class="auth-feat">
                    <i class="ti ti-briefcase"></i>
                    <span>تتبع طلباتك في مكان واحد</span>
                </div>
                <div class="auth-feat">
                    <i class="ti ti-clock"></i>
                    <span>وفّر وقتك وابقَ منظماً</span>
                </div>
                <div class="auth-feat">
                    <i class="ti ti-file-text"></i>
                    <span>سيرة ذاتية لكل وظيفة</span>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
