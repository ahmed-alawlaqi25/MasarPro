<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/svg+xml"
          href="{{ url_for('static', filename='images/logo.svg') }}">
    <link rel="icon" type="image/svg+xml"
          href="{{ url_for('static', filename='favicon.svg') }}">
    <title>{% block title %}مسار برو {% endblock %}</title>
    <!-- ========================= CSS here ========================= -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<!-- ========================= auth-section start ========================= -->
<section id="auth-section">
    <div class="auth-container">
        <div class="auth-card-1">
            <object data="{{ url_for('static', filename='img/logo.svg') }}"
                    type="image/svg+xml"
                    class="logo-color"></object>
            {% block form_content %}
            {% endblock %}
        </div>
        <div class="auth-card-2">
            <div class="auth-logo">
                <img class="logo-size-auth" src="{{ url_for('static', filename='img/logo.svg') }}" alt="logo">
                <b><span>Masar</span>Pro</b>
            </div>
            <div class="auth-features">
                <div class="auth-feat">
                    <i class="ti ti-briefcase"></i>
                    <span>تتبع طلباتك في مكان واحد</span>
                </div>
                <div class="auth-feat">
                    <i class="ti ti-clock"></i>
                    <span>وفّر وقتك وابقَ منظماً</span>
                </div>
                <div class="auth-feat">
                    <i class="ti ti-file-text"></i>
                    <span>سيرة ذاتية لكل وظيفة</span>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
